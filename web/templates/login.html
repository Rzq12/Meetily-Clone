{{define "login"}}<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · Notulensi AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md page-enter">
    <div class="w-full text-lg text-center border rounded-full bg-blue-50 border-white font-semibold text-gray-700 mb-6 block">Notulensi AI</div>
    <div class="bg-white rounded-lg border border-gray-200 p-6 shadow-sm">
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Masuk</h1>
      <p class="text-sm text-gray-600 mb-6">Gunakan akun yang diberikan oleh admin.</p>
      {{if .Data}}
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4 flex items-center gap-2" role="status">
        {{icon "info" "w-4 h-4 text-blue-600"}}<p class="text-sm text-blue-700">{{.Data}}</p>
      </div>
      {{end}}
      <div id="login-error" class="bg-red-50 border border-red-200 rounded-lg p-3 mb-4" role="alert" hidden>
        <p class="text-sm text-red-800"></p>
      </div>
      <form id="login-form" class="space-y-4" novalidate>
        <div class="space-y-2">
          <label for="username" class="label">Username</label>
          <input id="username" name="username" class="input" autocomplete="username" required minlength="3" maxlength="50" autofocus>
        </div>
        <div class="space-y-2">
          <label for="password" class="label">Password</label>
          <input id="password" name="password" type="password" class="input" autocomplete="current-password" required minlength="8" maxlength="128">
        </div>
        <button type="submit" class="btn btn-default w-full">
          <span class="spinner-sm" hidden></span><span>Masuk</span>
        </button>
      </form>
    </div>
  </div>
</div>
<script>
'use strict';
const form = document.getElementById('login-form');
const errorBox = document.getElementById('login-error');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = form.querySelector('button');
  const spinner = button.querySelector('.spinner-sm');
  errorBox.hidden = true;
  button.disabled = true;
  spinner.hidden = false;
  let res, data = {};
  try {
    res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value }),
    });
    data = await res.json();
  } catch (err) {
    data = { error: 'Tidak dapat terhubung ke server.' };
  }
  if (res && res.ok) {
    window.location.href = data.redirect;
    return;
  }
  errorBox.querySelector('p').textContent = data.error || 'Username atau password salah.';
  errorBox.hidden = false;
  button.disabled = false;
  spinner.hidden = true;
  form.password.value = '';
  form.password.focus();
});
</script>
</body>
</html>{{end}}
